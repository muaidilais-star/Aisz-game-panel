
name: Build AISZ GAME PANEL APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AISZ_GAME_PANEL_Android15.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project ZIP
        run: |
          unzip -q AISZ_GAME_PANEL_Android15.zip -d extracted
          test -f extracted/AISZ_GAME_PANEL/settings.gradle.kts

      - name: Build APK
        working-directory: extracted/AISZ_GAME_PANEL
        run: |
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AISZ-GAME-PANEL-debug-apk
          path: extracted/AISZ_GAME_PANEL/app/build/outputs/apk/debug/*.apk
          
